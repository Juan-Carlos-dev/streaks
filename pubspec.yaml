name: social_habit_tracker
description: A social habit tracker built with Flutter and Riverpod.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Architecture
  equatable: ^2.0.5
  dartz: ^0.10.1

  # UI Components
  table_calendar: ^3.1.0
  image_picker: ^1.0.7
  fl_chart: ^0.66.2
  cupertino_icons: ^1.0.6
  uuid: ^4.3.3
  timeago: ^3.6.1
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  device_preview: ^1.3.1
  flutter_colorpicker: ^1.1.0
  home_widget: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
